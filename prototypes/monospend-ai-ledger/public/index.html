<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MonoSpend AI Ledger</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell" aria-label="MonoSpend AI ledger">
      <aside class="notebook-rail" aria-label="Notebook list">
        <div class="rail-heading">
          <span>Notebooks</span>
          <button id="newNotebook" type="button" aria-label="Create notebook">+</button>
        </div>
        <div class="notebook-list" id="notebookList"></div>
      </aside>

      <section class="ledger-window" aria-label="Live money ledger">
        <header class="window-bar">
          <div class="traffic-lights" aria-hidden="true">
            <span class="red"></span>
            <span class="yellow"></span>
            <span class="green"></span>
          </div>
          <input id="notebookTitle" class="notebook-title" value="April 2026" aria-label="Notebook title">
          <div class="provider-chip" id="providerBadge">local</div>
        </header>

        <section class="ledger-body">
          <div class="column-head" aria-hidden="true">
            <span>input</span>
            <span>result</span>
          </div>

          <section class="ledger-block" aria-labelledby="incomeHeading">
            <div class="block-heading" id="incomeHeading">Income</div>
            <div class="code-group income-group" id="incomeRows"></div>
          </section>

          <section class="ledger-block" aria-labelledby="spendHeading">
            <div class="block-heading sr-only" id="spendHeading">Spending</div>
            <div class="code-group spend-group" id="expenseRows"></div>
          </section>

          <section class="ledger-block" aria-labelledby="calculatedHeading">
            <div class="rule-line"></div>
            <div class="block-heading" id="calculatedHeading">Calculated</div>
            <div class="code-group calculated-group" id="calculatedRows"></div>
          </section>
        </section>

        <footer class="command-dock" aria-label="AI capture command">
          <div class="command-line">
            <input
              id="commandInput"
              type="text"
              spellcheck="false"
              autocomplete="off"
              value="dinner sushi 45.90"
              aria-label="Type a spending note"
            >
            <button id="submitCommand" type="button" aria-label="Add ledger line">Add</button>
          </div>

          <div class="dock-tools" aria-label="Capture and export tools">
            <div class="mode-switch" role="tablist" aria-label="Input mode">
              <button class="mode-tab active" type="button" data-mode="text">Text</button>
              <button class="mode-tab" type="button" data-mode="voice">Voice</button>
              <button class="mode-tab" type="button" data-mode="photo">Photo</button>
            </div>
            <input id="photoInput" type="file" accept="image/*" aria-label="Upload receipt image">
            <button class="tool-button" type="button" id="recordButton">Record</button>
            <button class="tool-button" type="button" id="sampleButton">Sample</button>
            <button class="tool-button" type="button" id="exportMarkdown">MD</button>
            <button class="tool-button" type="button" id="exportJson">JSON</button>
            <button class="tool-button" type="button" id="exportCsv">CSV</button>
            <button class="tool-button danger" type="button" id="clearLedger">Clear</button>
          </div>

          <p class="status-line" id="message" role="status">Type a money note and press Enter.</p>
          <p class="status-line secondary" id="voiceStatus">Voice capture uses browser speech support when available.</p>
          <img id="receiptPreview" class="receipt-preview" alt="Receipt preview">
        </footer>
      </section>

      <aside class="summary-panel sr-only" aria-label="Ledger summary">
        <dl>
          <dt>Saved spend</dt>
          <dd id="totalAmount">$0.00</dd>
          <dt>Entries</dt>
          <dd id="entryCount">0 entries</dd>
          <dt>Top category</dt>
          <dd id="topCategory">none</dd>
        </dl>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
